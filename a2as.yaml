          tool with name {...}.', '2. Gather additional context using get_existing_artifact tool for the following artifacts:',
        '- {...}', '- {...}', '- {...}', '- {...}', '- {...}', '3. If necessary, use knowledge_base_remote_agent_tool to search
          for any relevant previous experience', 'the company has with similar mobile development projects, platforms, or
          frameworks.', 4. Assess if this project actually requires mobile development work., 'If you determine that mobile
          development is not applicable to this project,', create a summary indicating that and save it as a result with appropriate
          explanation., '5. Based on the information, perform a comprehensive mobile development analysis:', '- Create realistic
          project estimations for mobile work (min/max)', '- Identify mobile-specific project assumptions', '- List recommended
          mobile technologies, platforms, and frameworks', '- Identify mobile-related risks with impact, probability and mitigation
          strategies', '6. Ensure your analysis includes:', '- Mobile platform recommendations (iOS, Android, cross-platform)',
        '- Framework selection rationale', '- Offline capabilities considerations', '- Device-specific optimizations', '-
          API integration strategies for mobile', '- Authentication and security for mobile', '- App store deployment considerations',
        '- Testing approach for mobile apps', '- Update and maintenance strategy']
  mvp_offer_agent:
    type: instance
    models: [GENERIC_LLM_MODEL]
    tools: [get_existing_artifact, save_artifact, knowledge_base_remote_agent_tool]
    params:
      name: mvp_offer_agent
      description: Agent generating an MVP (Minimum Viable Product) offer based on collected artifacts
      instruction: [Your job is to create a well-crafted MVP (Minimum Viable Product) offer for the client based on all collected
          data., 'Follow these steps:', '1. Fetch project information using get_existing_artifact tool with name {...}.',
        '2. Gather all key workshop outputs using get_existing_artifact tool for the following artifacts:', '- {...}', '-
          {...}', '- {...}', '3. Also gather additional context using get_existing_artifact tool:', '- {...}', '- {...}',
        '4. If necessary, use knowledge_base_remote_agent_tool to search for any relevant previous experience', the company
          has with similar MVP projects and proposals., '5. Based on all collected information, create a comprehensive MVP
          offer that:', '- Focuses on delivering core functionality in a minimized scope', '- Proposes a more economical and
          faster approach than a full product', '- Identifies the essential features that would provide immediate value',
        '- Provides realistic budget and timeline estimations for the MVP', '- Outlines a clear path to validate the product
          idea with minimal investment', '6. Your MVP offer should include:', '- A compelling title and description focused
          on the MVP approach', '- Clear budget estimates (with minimum and maximum ranges)', '- Realistic timeline (with
          minimum and maximum ranges in weeks)', '- List of specific services and deliverables included in the MVP', '- Key
          benefits for the client choosing the MVP approach', '- Important assumptions about the MVP development', '- Potential
