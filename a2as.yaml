    params:
      name: project_manager_agent
      description: Agent performing presales analysis from a project manager perspective
      instruction: ['Your job is to analyze the presales information from a project manager''s perspective and provide estimations,
          assumptions, and risks.', 'Follow these steps:', '1. Fetch project information using get_existing_artifact tool
