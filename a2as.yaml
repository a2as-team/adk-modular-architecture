  save_artifact:
    type: function
    agents: [ux_agent, project_manager_agent, project_analyst_agent, market_analysis_agent, mvp_offer_agent, of_the_shelf_solution_search_agent,
      services_offer_agent, internal_presales_summary_agent, solution_architect_agent, lead_information_retrieval_agent, root_agent.1,
      workshop_offer_agent, company_experience_analysis_agent, product_design_summary_agent, ui_agent, backend_development_agent,
      dev_ops_development_agent, ai_solutions_agent, frontend_development_agent, customer_competitors_search_agent, mobile_development_agent,
      product_offer_agent]
  search_company_knowledge_base:
    type: function
    agents: [root_agent.0]
  web_search_agent_tool:
    type: function
    agents: [market_analysis_agent, of_the_shelf_solution_search_agent, lead_information_retrieval_agent, customer_competitors_search_agent]
  web_search_agent_tool.1:
    type: agent
    params:
      wrapper: AgentTool

mcp:
  MCPToolset:
    type: network
    url: WEB_SCRAPPER_MCP_URL
    params:
      class: MCPToolset
      connection_type: SseServerParams
      function: get_web_scrapper_tools

teams:
  document_analysis_manager_agent:
    type: parallel
    agents: [document_analysis_manager_agent, project_analyst_agent]
  offering_manager_agent:
    type: parallel
    agents: [offering_manager_agent, mvp_offer_agent, workshop_offer_agent, services_offer_agent, product_offer_agent, internal_presales_summary_agent]
  presales_sequence_agent:
    type: sequential
    agents: [presales_sequence_agent, document_analysis_manager_agent, research_manager_agent, workshop_manager_agent, offering_manager_agent]
  product_design_agent:
    type: sequential
    agents: [product_design_agent, ux_agent, ui_agent, product_design_summary_agent]
  research_manager_agent:
    type: parallel
    agents: [research_manager_agent, company_experience_analysis_agent, customer_competitors_search_agent, market_analysis_agent,
      lead_information_retrieval_agent, of_the_shelf_solution_search_agent]
  root_agent.1:
    type: hierarchy
    agents: [root_agent.1, presales_sequence_agent]
  technical_agents:
    type: parallel
    agents: [technical_agents, project_manager_agent, product_design_agent, frontend_development_agent, backend_development_agent,
      mobile_development_agent, dev_ops_development_agent, ai_solutions_agent]
  workshop_manager_agent:
    type: sequential
    agents: [workshop_manager_agent, technical_agents, solution_architect_agent]

